name: Release Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag for the reviewed commit (must match Cargo/package/Tauri version)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aerotune-windows-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Validate and build signed Windows assets
    runs-on: windows-2025
    environment: aerotune-release
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      release_commit: ${{ steps.resolve_release_ref.outputs.release_commit }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\src-tauri\target
      AEROTUNE_RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Check out reviewed main commit without a persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Resolve release tag commit and clean checkout state
        id: resolve_release_ref
        shell: pwsh
        run: |
          $tagRef = "refs/tags/$($env:AEROTUNE_RELEASE_TAG)^{commit}"
          $tagCommit = (git rev-parse --verify $tagRef).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Release tag does not exist: $env:AEROTUNE_RELEASE_TAG" }
          $headCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Cannot resolve checked-out commit" }
          $status = git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw "Cannot inspect release checkout" }
          $clean = if ([string]::IsNullOrWhiteSpace(($status -join ""))) { "true" } else { "false" }
          "AEROTUNE_RELEASE_TAG_COMMIT=$tagCommit" >> $env:GITHUB_ENV
          "AEROTUNE_CHECKED_OUT_COMMIT=$headCommit" >> $env:GITHUB_ENV
          "AEROTUNE_RELEASE_WORKTREE_CLEAN=$clean" >> $env:GITHUB_ENV
          "release_commit=$headCommit" >> $env:GITHUB_OUTPUT

      - name: Validate tag and synchronized release versions
        run: node scripts/validate-github-release-tag.mjs

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.8.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install stable MSVC Rust toolchain, rustfmt, and Clippy
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          cache: false

      - name: Run release-quality tests without signing secrets
        run: pnpm run check:release

      - name: Create temporary updater overlay from the public key
        shell: pwsh
        env:
          AEROTUNE_UPDATE_PUBLIC_KEY: ${{ vars.AEROTUNE_UPDATE_PUBLIC_KEY }}
        run: |
          $overlayPath = (node scripts/create-github-updater-overlay.mjs).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($overlayPath)) { throw "Cannot create the validated public updater overlay" }
          "AEROTUNE_UPDATER_CONFIG=$overlayPath" >> $env:GITHUB_ENV

      - name: Build signed NSIS and Tauri updater artifacts
        run: pnpm run build:updater-release
        env:
          AEROTUNE_UPDATE_ENDPOINT: https://github.com/shengqiangdd/AeroTune/releases/latest/download/latest.json
          AEROTUNE_UPDATE_PUBLIC_KEY: ${{ vars.AEROTUNE_UPDATE_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Record updater bounds and verify cryptographic signature
        run: node scripts/measure-updater-artifact-bounds.mjs
        env:
          AEROTUNE_UPDATE_PUBLIC_KEY: ${{ vars.AEROTUNE_UPDATE_PUBLIC_KEY }}
          AEROTUNE_REVIEWED_COMPRESSED_CAP_BYTES: 67108864
          AEROTUNE_REVIEWED_EXPANDED_CAP_BYTES: 134217728

      - name: Create version-bound GitHub updater manifest
        run: node scripts/create-github-release-manifest.mjs

      - name: Upload exact release assets for the publish-only job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aerotune-windows-release-${{ inputs.release_tag }}
          path: |
            ${{ github.workspace }}\src-tauri\target\release\bundle\nsis\AeroTune_*_x64-setup.exe
            ${{ github.workspace }}\src-tauri\target\release\bundle\nsis\AeroTune_*_x64-setup.nsis.zip
            ${{ github.workspace }}\src-tauri\target\release\bundle\nsis\AeroTune_*_x64-setup.nsis.zip.sig
            ${{ github.workspace }}\src-tauri\target\release\bundle\nsis\latest.json
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: build
    name: Publish GitHub Release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      AEROTUNE_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Revalidate release tag against the built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compare publication tag target with the validated build commit
        shell: pwsh
        env:
          AEROTUNE_EXPECTED_RELEASE_COMMIT: ${{ needs.build.outputs.release_commit }}
        run: |
          $publishedCommit = (git rev-parse "HEAD^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Cannot resolve the publication tag commit." }
          if ([string]::IsNullOrWhiteSpace($env:AEROTUNE_EXPECTED_RELEASE_COMMIT) -or $publishedCommit -ne $env:AEROTUNE_EXPECTED_RELEASE_COMMIT) {
            throw "Release tag changed after build validation; refusing to attach assets to a different commit."
          }

      - name: Download the immutable build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aerotune-windows-release-${{ inputs.release_tag }}
          path: release-assets

      - name: Publish release without replacing existing tags or assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          installers=(release-assets/AeroTune_*_x64-setup.exe)
          archives=(release-assets/AeroTune_*_x64-setup.nsis.zip)
          signatures=(release-assets/AeroTune_*_x64-setup.nsis.zip.sig)
          manifest=release-assets/latest.json
          test "${#installers[@]}" -eq 1
          test "${#archives[@]}" -eq 1
          test "${#signatures[@]}" -eq 1
          test -s "$manifest"
          if gh release view "$AEROTUNE_RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace signed assets." >&2
            exit 1
          fi
          gh release create "$AEROTUNE_RELEASE_TAG" \
            "${installers[0]}" "${archives[0]}" "${signatures[0]}" "$manifest" \
            --verify-tag --latest --title "AeroTune $AEROTUNE_RELEASE_TAG" \
            --notes "Signed Windows NSIS installer and Tauri updater bundle. Tauri Minisign verifies updater payloads; it is not Authenticode publisher signing."
